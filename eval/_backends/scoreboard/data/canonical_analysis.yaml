# Reference embedded OPER tail percentiles on the DOCUMENTED o96->o320 REGRIDDED
# contract support (n=49005, 2026-06 reference gribs). NOT used in scoring -- read
# only by the off-support guardrail (_warn_on_offcontract_support in tc.py) to WARN
# when a run's embedded OPER was computed on a different TC-stats support (native /
# legacy manual "strict") and is therefore not comparable to the public scoreboard.
# mslp_min flags native; wind_p99 (a broad percentile) additionally flags manual strict.
o320_contract_oper:
  idalia:
    mslp_min: 985.408
    wind_p99: 12.343
    wind_max: 24.515
  franklin:
    mslp_min: 957.395
    wind_p99: 16.202
    wind_max: 36.228
