    - sin_longitude
    - z
  high_res_input:
    - cos_julian_day
    - cos_latitude
    - cos_local_time
    - cos_longitude
    - lsm
    - sin_julian_day
    - sin_latitude
    - sin_local_time
    - sin_longitude
    - z
  truth:
    root: /home/ecm5702/perm/reference/o1280_o2560
  time_step: 24h
  lead_time: 240h
  platform:
    gpu:
      time: "0-12:18"

# Same lane as spectra_ecmwf above. This lane already stages through
# template_grib_root, which clones a real GRIB message and so already uses the
# complete grid, so v2 differs only in internals: the truncation is passed to
# gptosp explicitly and verified, amplitudes come from eccodes rather than
# Metview, curve names are the ones the scoreboard reads, and the reference
# cache is keyed by evaluation window and staging template.
spectra_ecmwf_v2:
  truncation: 2559  # O2560 nominal cubic-octahedral truncation: TCo2559
  template_grib_root: "/home/ecm5702/hpcperm/data/input_data/o1280_o2560/humberto_20250926_20250930/o2560_targets"
  weather_states: ["10u", "10v", "2t", "msl"]
  reference_dir: "/home/ecm5702/perm/reference/o1280_o2560/spectra_ecmwf"
  steps: [120]
  members: [1]
  truth_label: "IEKM"
  input_label: "x_interp"
  input_bundles_dir: "/home/ecm5702/scratch/eval/manual_811960e6_new_o1280_o2560_20260512_ep130_100k/bundles_with_y"
