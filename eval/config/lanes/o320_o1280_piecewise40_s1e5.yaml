# o320_o1280_piecewise40_s1e5.yaml
# Sampler-schedule ablation vs the 2026-07-16 owner standard (30-step piecewise,
# sigma_max=1e5): SAME noise ceiling as the current standard, but a LONGER
# 40-step budget (vs 30) to test whether more steps at the established ceiling
# deepens TC extremes further. Split kept at the base lane's ~1:2 high:low
# ratio (13 high / 27 low). Everything else is UNCHANGED from the base
# o320_o1280 lane.
base: o320_o1280

predict:
  sampler:
    schedule_type: "experimental_piecewise"
    num_steps: 40
    sigma_max: 100000.0
    sigma_transition: 10.0
    sigma_min: 0.03
    high_schedule_type: "exponential"
    low_schedule_type: "karras"
    num_steps_high: 13
    num_steps_low: 27
    rho: 7.0
    sampler: "heun"
    S_churn: 2.5
    S_min: 0.75
    S_max: 100000.0
    S_noise: 1.05
