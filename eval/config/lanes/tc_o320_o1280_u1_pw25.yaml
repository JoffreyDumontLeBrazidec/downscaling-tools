# U1 arm pw25 (TD-219, 2026-10-15) - sigma_max vs step density above sigma 10, s397434 on the
# regional tc_o320_o1280 lane (matrix7 harness). Arm (c): sigma_max 1000 with 5 high steps
# (same log spacing in [10, 1000] as the 10-high pw30s100k standard) + 20 low. All other keys
# identical to tc_o320_o1280_m7_pw30s1k (churn on, S_max = sigma_max). Screening only.
base: tc_o320_o1280

predict:
  sampler:
    schedule_type: "experimental_piecewise"
    num_steps: 25
    sigma_max: 1000.0
    sigma_transition: 10.0
    sigma_min: 0.03
    high_schedule_type: "exponential"
    low_schedule_type: "karras"
    num_steps_high: 5
    num_steps_low: 20
    rho: 7.0
    sampler: "heun"
    S_churn: 2.5
    S_min: 0.75
    S_max: 1000.0
    S_noise: 1.05
