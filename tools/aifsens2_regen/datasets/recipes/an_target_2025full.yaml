name: downscaling-od-an-oper-0001-mars-o1280-2025-2025-12h-6h-v1-aifscrps-validtime
description: "FULL YEAR 2025 (1 Jan 00 UTC to 31 Dec 12 UTC 2025, starts at 00 and 12 UTC, leads 6 and 12 h). Operational O1280 analysis (class od, stream oper, expver 0001, type an) at the VALID time of each (init, lead) sample of the full-year 2025 AIFS-CRPS input store downscaling-ai-pf-enfo-0001-mars-o320-2025-2025-12h-6h-v1-aifscrps, on the SAME synthetic forecast axis (origin 1900-01-01), so every 6-hourly analysis is used exactly once. The input store it pairs with is split across two MARS experiment versions, expver 0103 for starts up to and including 2025-07-01 00 UTC and expver 0001 from 2025-07-01 12 UTC onward, but the target itself is the operational analysis throughout and needs no split. Target store of the AIFS->analysis o320->o1280 lane. Built with the fake_forecasts analysis-at-valid-time source (fork branch feature/aifs-regen-2026-early)."
attribution: ECMWF
licence: CC-BY-4.0
dates:
  start: 2025-01-01 00:00:00
  end: 2025-12-31 12:00:00
  frequency: 12h
  fake_forecasts: true
  steps: [6, 12]
build:
  group_by: forecast

input:
  join:
  - mars:
      class: od
      stream: oper
      expver: "0001"
      type: an
      levtype: sfc
      grid: o1280
      param: [10u, 10v, 2d, 2t, tcw, sp, skt, msl]
  - mars:
      class: od
      stream: oper
      expver: "0001"
      type: an
      levtype: pl
      grid: o1280
      levelist: [50, 100, 200, 300, 400, 500, 700, 850, 925, 1000]
      param: [q, t, u, v, w, z]
output:
  chunking: {dates: 1, ensembles: 1, variables: 34}
  dtype: float32
  ensemble_dimension: 2
  flatten_grid: true
  order_by: [{valid_datetime: ascending}, {param_level: ascending}, {number: ascending}]
  remapping: {param_level: "{param}_{levelist}"}
  statistics: param_level
