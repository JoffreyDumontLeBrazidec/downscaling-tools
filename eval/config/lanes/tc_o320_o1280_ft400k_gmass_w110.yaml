# tc_o320_o1280_ft400k_gmass_w110 -- ft400k gmass weight SWEEP arm, REGIONAL screen (owner 2026-08-22:
# "use regional prediction to go fast and try out different w to find the best one to run
# monthly"). Global ft400k checkpoint run on the franklin_idalia box via cut_graph, 1 GPU.
# SCREENING ONLY -- never a scoreboard row (base-lane doctrine), and NOT comparable to the
# global w12_30/w13_30 numbers: the runtime-match rule forbids cross-route comparison, which
# is why ctrl and w1.20/w1.30 are re-run here as in-route anchors.
# The box cannot give spherical-harmonic spectra, so this screen decides on TC DEPTH AND
# 10m WIND ONLY (wind carries equal weight with depth, owner 2026-08-22); the spectral cost
# of the winning weight must be confirmed on the global lane afterwards.
# D_bad = 34fdb91e d50k, the earliest true ancestor of the ft400k lineage.
base: tc_o320_o1280

predict:
  sampler:
    schedule_type: "experimental_piecewise"
    num_steps: 30
    sigma_max: 100000.0
    sigma_transition: 10.0
    sigma_min: 0.03
    high_schedule_type: "exponential"
    low_schedule_type: "karras"
    num_steps_high: 10
    num_steps_low: 20
    rho: 7.0
    sampler: "heun"
    S_churn: 2.5
    S_min: 0.75
    S_max: 100000.0
    S_noise: 1.05
    autoguide_checkpoint: "/home/ecm5702/perm/checkpoints-jupiter-rebaseline-20260716/34fdb91e87cd413ca510bb1f6749dbdb/inference-anemoi-by_step-epoch_021-step_050000.ckpt"
    autoguide_weight: 1.0
    autoguide_weight_map: {msl: 1.1, sp: 1.1, z_100: 1.1, z_1000: 1.1, z_200: 1.1, z_300: 1.1, z_400: 1.1, z_50: 1.1, z_500: 1.1, z_700: 1.1, z_850: 1.1, z_925: 1.1}
