# o48->o96 FAST experimentation lane (auto-derived from o48_o96_j758_sep2025_eval.yaml)
# Reduced predict: 6 dates x 10 members x 5 steps = 300 fc (~5x faster than the month).
# Full panel: tc(humberto)+spectra+spectra_ecmwf+surface+probabilistic(CRPS)+sigma_loss(per-sigma).
prepare:
  bundle_filename_tpl: enfo_o48_0001_date{date}_time0000_mem{member:02d}_step{step:03d}h_input_bundle.nc
  args:
    lres_sfc_grib: '{source_grib_root}/enfo_o48_0001_date{date}_time0000_mem1to10_step24to120_sfc.grib'
    lres_pl_grib: '{source_grib_root}/enfo_o48_0001_date{date}_time0000_mem1to10_step24to120_pl.grib'
    hres_grib: '{source_grib_root}/enfo_o96_0001_date{date}_time0000_step24to120_sfc.grib'
    target_sfc_grib: '{source_grib_root}/iekm_o96_iekm_date{date}_time0000_step24to120_sfc_y.grib'
    target_pl_grib: '{source_grib_root}/iekm_o96_iekm_date{date}_time0000_step24to120_pl_y.grib'
  optional_sidecars:
  - file: '{source_grib_root}/enfo_o48_0001_date{date}_time0000_mem1to10_step24to120_sfc_tp.grib'
    arg: lres_sfc_extra_grib
  - file: '{source_grib_root}/iekm_o96_iekm_date{date}_time0000_step24to120_sfc_y_tp.grib'
    arg: target_sfc_extra_grib
