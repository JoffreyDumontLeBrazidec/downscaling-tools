    validation: 1
    test: 1
  batch_size:
    training: 1
    validation: 1
    test: 1
  limit_batches:
    training: 650
    validation: 18
    test: 2
  grid_indices:
    datasets:
      in_lres:
        _target_: anemoi.training.data.grid_indices.FullGrid
        nodes_name: data
      in_hres:
        _target_: anemoi.training.data.grid_indices.FullGrid
        nodes_name: data
