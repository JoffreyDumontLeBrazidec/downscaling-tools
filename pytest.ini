[pytest]
# One command, `python -m pytest`, collects every test folder of the repository.
# importlib mode is needed because several folders have test files with the same name
# and some have no __init__.py; see TESTING.md.
testpaths =
    manual_inference
    manual_inference_legacy_ds
    eval
    tools
addopts = -ra --import-mode=importlib
# eval/_quarantine holds retired code and its tests; they import modules that no
# longer exist, so never collect them. The rest is pytest's default list.
norecursedirs = .* *.egg _darcs build CVS dist node_modules venv {arch} _quarantine
