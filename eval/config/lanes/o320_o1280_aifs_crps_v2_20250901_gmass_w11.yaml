    high_schedule_type: "exponential"
    low_schedule_type: "karras"
    num_steps_high: 10
    num_steps_low: 20
    rho: 7.0
    sampler: "heun"
    S_churn: 2.5
    S_min: 0.75
    S_max: 100000.0
    S_noise: 1.05
    autoguide_checkpoint: "/home/ecm5702/perm/checkpoints-jupiter-rebaseline-20260716/34fdb91e87cd413ca510bb1f6749dbdb/inference-anemoi-by_step-epoch_021-step_050000.ckpt"
    autoguide_weight: 1.0
    autoguide_weight_map: {msl: 1.1, sp: 1.1, z_50: 1.1, z_100: 1.1, z_200: 1.1, z_300: 1.1, z_400: 1.1, z_500: 1.1, z_700: 1.1, z_850: 1.1, z_925: 1.1, z_1000: 1.1}
