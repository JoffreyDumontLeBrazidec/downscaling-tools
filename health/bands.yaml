# Network-health bands (readings, not gates: nothing here stops a run; owner 30 Oct 2026, review note s8).
#
# Each rule matches "<check>.<role group>.<metric>" with fnmatch, first match wins. Role groups: encoder, processor,
# decoder, mapper. Status per value:
#   FAIL  exact-zero findings (dead head, dead unit, zero gain, NaN): `fail_above: 0`
#   WARN  outside the provisional band; WARN bands are set from the first audit sweep (note s9) and tightened as
#         references land. A rule with no warn_* keys only reports the number.
#   ok    inside every band.
# `change_warn` (check 12): relative change vs the previous checkpoint or the lane reference above which the diff
# lists the metric (default 0.25).

rules:
  # --- check 1: zero content (widening saddle) -------------------------------------------------------------------
  - match: "c1_zero_content.*.zero_head_frac"
    fail_above: 0
  - match: "c1_zero_content.*.partial_head_frac"
    warn_above: 0
  - match: "c1_zero_content.*.zero_unit_frac"
    fail_above: 0
  # --- check 3: gradient-dead from the optimizer state ----------------------------------------------------------
  - match: "c3_optimizer_dead.*.grad_dead_unit_frac"
    fail_above: 0
  - match: "c3_optimizer_dead.*.grad_dead_head_frac"
    fail_above: 0
  - match: "c3_optimizer_dead.*.recent_dead_unit_frac"
    warn_above: 0.01
  - match: "c3_optimizer_dead.*.zero_moment_coord_frac"
    warn_above: 0.01
  # --- check 6: scale ladders ---------------------------------------------------------------------------------------
  - match: "c6_scale.*.edge_logit_scale.max"   # s11 ladder: healthy < 0.2, growing > 0.5, trap > 80
    warn_above: 0.5
  - match: "c6_scale.*.zero_gain_frac"
    fail_above: 0
  - match: "c6_scale.*.low_gain_frac"
    warn_above: 0
  - match: "c6_scale.*.low_norm_unit_frac"     # DB300 proc.2: 154 low-norm units of 2,048 (7.5 %) in the parent
    warn_above: 0.05
  - match: "c6_scale.*.rms_over_init"          # band from the first sweep
  - match: "c6_scale.*.g_q.rms"
  - match: "c6_scale.*.g_k.rms"
  # --- check 2: gradient-dead on K forward/backward batches (GPU) ----------------------------------------------------
  - match: "c2_grad_dead.*.dead_unit_frac"
    fail_above: 0
  - match: "c2_grad_dead.*.dormant_unit_frac"
    warn_above: 0.01
  - match: "c2_grad_dead.*.dead_head_frac"
    fail_above: 0
  # --- check 4: pre-activation saturation (GPU) --------------------------------------------------------------------
  - match: "c4_preact.*.never_fires_frac"      # max pre-activation < -5.55: erf-GELU output exactly 0 on every node
    warn_above: 0.01
  - match: "c4_preact.*.no_grad_frac"          # max pre-activation < -14: gradient exactly 0 (exp underflow)
    fail_above: 0
  - match: "c4_preact.*.linearised_frac"       # min pre-activation > 0 on every node: the unit is a linear map
    warn_above: 0.05
  # --- check 7: residual-stream budget (GPU) -----------------------------------------------------------------------
  - match: "c7_stream.processor.update_ratio"  # ||block update|| / ||stream in||; < 1 % = the block does nothing
    warn_below: 0.01
  - match: "c7_stream.*.massive_ratio"         # max |x| / median |x| of the block output (Sun et al. 2024)
  - match: "c7_stream.*.dirichlet"
  # --- check 9: information flow (GPU) -----------------------------------------------------------------------------
  - match: "c9_flow.*.unread_input_frac"
    fail_above: 0
  - match: "c9_flow.*.silent_output_frac"
    fail_above: 0
  # --- check 8: graph ------------------------------------------------------------------------------------------------
  - match: "c8_graph.*.isolated_frac"
    fail_above: 0
  - match: "c8_graph.*.extra_components"
    fail_above: 0
