    congo_river_delta: [-7.0, -4.0, 11.0, 15.0]
    rift_valley_tight: [7.0, 10.0, 37.0, 41.0]
    alps_innsbruck: [46.0, 49.0, 10.0, 14.0]
    tokyo_bay: [34.0, 37.0, 138.5, 142.5]
    florida_keys: [24.0, 27.0, -83.0, -79.0]
    crete_south: [34.0, 37.0, 23.5, 27.5]

