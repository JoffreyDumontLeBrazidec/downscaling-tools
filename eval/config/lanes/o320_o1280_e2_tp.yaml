base: o320_o1280

# The total-precipitation read of an E2-box run (10-70 N, 80 W-40 E), 12 h accumulations.
# Added 2026-10-21 for the CA300 tp read: 30 dates of 2023 (00 UTC), leads +12..+72 h.
# Run: python -m eval.cli evaluate --lane o320_o1280_e2_tp --host jupiter --only precip_read \
#        --predictions-dir <dir of predictions_<date>_step<NNN>.nc> --run-label CA300
# Replot from the saved files: the same command with --plot-only.
# Per-bin tp spectra: box_spectra on the same directory.

allowed_hosts:
  evaluate: [jupiter, atos_ac, atos_ag]

precip_read:
  var: tp
  accum_hours: 12
  thresholds: [20, 50, 100, 150, 200]
  regions:
    all: null
    10-25N: [10.0, 25.0, -180.0, 180.0]
    25-40N: [25.0, 40.0, -180.0, 180.0]
    40-70N: [40.0, 70.01, -180.0, 180.0]
    europe: [35.0, 70.01, -12.0, 40.0]
  # Storm boxes are centred on the truth msl minimum of the 20 Oct six-lead case list
  # (docs epics/misc/support/20261021_fleet_reads/ca300_leads/storms/case_list.md).
  # Idalia (2023-08-29) sits on the box edge and has no case here.
  cases:
    - {name: franklin_20230829_s024, label: "Franklin", date: "20230829", step: 24, box: [25.0, 39.0, -77.0, -63.0]}
    - {name: lee_20230909_s024, label: "Lee", date: "20230909", step: 24, box: [14.0, 28.0, -66.0, -52.0]}
    - {name: nigel_20230919_s024, label: "Nigel", date: "20230919", step: 24, box: [25.5, 39.5, -62.0, -48.0]}
    - {name: tammy_20231021_s024, label: "Tammy", date: "20231021", step: 24, box: [10.0, 24.0, -69.0, -55.0]}
    - {name: franklin_20230829_s072, label: "Franklin", date: "20230829", step: 72, box: [28.0, 42.0, -67.0, -53.0]}
    - {name: alps_20231021_s024, label: "Alps", date: "20231021", step: 24, box: [43.0, 49.5, 3.0, 17.0]}
    - {name: alps_20230226_s024, label: "Alps", date: "20230226", step: 24, box: [43.0, 49.5, 3.0, 17.0]}
    - {name: europe_20231021_s024, label: "Europe", date: "20231021", step: 24, box: [40.0, 62.0, -25.0, 20.0]}
    - {name: europe_20230516_s024, label: "Europe", date: "20230516", step: 24, box: [40.0, 62.0, -25.0, 20.0]}
    - {name: europe_20230226_s024, label: "Europe", date: "20230226", step: 24, box: [40.0, 62.0, -25.0, 20.0]}
  map_groups:
    storms: [franklin_20230829_s024, lee_20230909_s024, nigel_20230919_s024, tammy_20231021_s024]
    alps: [alps_20231021_s024, alps_20230226_s024]
    europe_fronts: [europe_20231021_s024, europe_20230516_s024, europe_20230226_s024]
  map_titles:
    storms: "tp in tropical cyclones, +24 h: truth, input and CA300"
    alps: "tp over the Alps, +24 h: truth, input and CA300"
    europe_fronts: "European frontal rain, +24 h: truth, input and CA300"
  map_members: [0, 1, 2]
  bootstrap: 2000

# Station observations (added 2026-11-02): ensemble scores of the run at STVL stations (fair CRPS,
# spread/skill, rank histograms, tp twCRPS and fair Brier), next to input, truth and HRES as single fields.
# Cache: `python3 -m eval.cli obs fetch` on Atos (module python3 + vtb), copied to Jupiter.
# Run:   python -m eval.cli evaluate --lane o320_o1280_e2_tp --host jupiter --only obs_points \
#          --predictions-dir <dir of predictions_<date>_step<NNN>.nc, all leads> --run-label CA300
# Two runs, paired by date: python -m eval.cli obs compare --a <runA>/evaluators/obs_points \
#          --b <runB>/evaluators/obs_points --out <dir>
obs_points:
  # 30 seed-locked dates of 2023, leads 12-72 h, box 9-71 N 81 W-41 E; manifest in cache_meta.json
  cache:
    jupiter: /e/data1/jureap-data/ecmwf/users/jdumont/station_caches/e2_2023_v1
    atos: /home/ecm5702/hpcperm/data/station_caches/e2_2023_v1
  vars: [2t, 10ff, msl, tp]
  regions:
    all: null
    europe: [35.0, 75.0, -12.5, 42.5]
    40-70N: [40.0, 70.01, -180.0, 180.0]
    25-40N: [25.0, 40.0, -180.0, 180.0]
    10-25N: [10.0, 25.0, -180.0, 180.0]
  height_classes:
    all_dz<100m: [0.0, 100.0]
    all_dz>=300m: [300.0, 100000.0]
  thresholds: [5, 10, 20]      # mm per 12 h
  radii: [0, 18, 36]           # km, tp disc means; 0 = nearest grid point
  max_km: 15.0
  lapse_rate: 0.0065           # K/m, quaver
  input_height_column: h_o320_eefh  # the eefh hindcast's own O320 orography (input model), not h_o320 (O1280 interpolated)
  min_stations: 30
  weighting: none              # or station_density (quaver's kernel)
  seeps: true                  # 24 h SEEPS (tp24 + seeps_clim_tp24.csv in the cache)
  plot_regions: [all, europe]

# Tropical cyclones against the IBTrACS best track and the operational HRES/ENS trackers (added 2026-11-02).
# Needs tc_structure's cases.csv (default <run>/evaluators/tc_structure/cases.csv; set tc_obs.cases otherwise).
# Cache: python3 -m eval.cli obs fetch-tc (Atos). Storms: franklin=4648 idalia=4654 lee=4660 margot=4661
# nigel=4662 philippe=4667 tammy=4679; dates 20230822 20230829 20230909 20230919 20230930 20231021.
tc_obs:
  cache:
    jupiter: /e/data1/jureap-data/ecmwf/users/jdumont/agent-work/20261102-obs-eval/cache/tc_2023_v2
    atos: /ec/res4/scratch/ecm5702/agent-work/20261102-obs-eval/cache/tc_2023_v2
  # NOAA NCEI IBTrACS v04r01 (downloaded 2026-11-01, sha256 6666...2c97): best-track wind (USA_WIND x 0.93,
  # 10-minute equivalent), USA_PRES and USA_RMW; read at run time, before the cache's best-track rows
  noaa_csv:
    jupiter: /e/data1/jureap-data/ecmwf/users/jdumont/agent-work/20261102-obs-eval/cache/ibtracs_csv/ibtracs.NA.list.v04r01.csv
    atos: /home/ecm5702/perm/obs/ibtracs/ibtracs.NA.list.v04r01.csv
  only_storm_ok: true
  max_gap_h: 6

# 12 h tp against IMERG Final V07B on the same O1280 points (added 2026-11-02). Cut: python3 -m eval.cli
# obs fetch-imerg (Atos). IMERG is weak poleward of 60 N and over snow: regions stay within 25-60 N.
obs_imerg:
  imerg:
    jupiter: /e/data1/jureap-data/ecmwf/users/jdumont/agent-work/20261102-obs-eval/cache/imerg_e2_2023_tp12_v1.nc
    atos: /ec/res4/scratch/ecm5702/agent-work/20261102-obs-eval/cache/imerg_e2_2023_tp12_v1.nc
  regions:
    25-60N: [25.0, 60.0, -80.0, 40.0]
    europe: [35.0, 60.0, -12.5, 40.0]
    25-40N: [25.0, 40.0, -80.0, 40.0]
    40-60N: [40.0, 60.0, -80.0, 40.0]
  thresholds: [5, 10, 20]      # mm per 12 h
  plot_regions: [25-60N, europe]
