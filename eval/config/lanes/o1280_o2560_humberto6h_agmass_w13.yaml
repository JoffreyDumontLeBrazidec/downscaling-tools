# o1280_o2560_humberto6h_agmass_w13.yaml
# AUTOGUIDANCE arm (mass-only, w=1.3) of the Humberto Sept-2025 window on the
# PRISTINE o1280->o2560 rebaseline fccc23df s300k. First guidance run on this lane.
# Control = the 2026-08-17 pristine manual run (o2560_humberto_manual_20260817T125053Z);
# everything here is IDENTICAL to that run except the autoguide_* sampler keys.
#
# Mass-only on THIS lane = {msl} alone: the model outputs only 9 surface channels
# (10u 10v 2d 2t msl skt tcw tp cp — from the ckpt anemoi.json), so the 12-channel
# mass map used on o320->o1280 (msl, sp, z_*) collapses to one channel here.
# autoguide_weight is deliberately NOT set: the wrapper then defaults non-mapped
# channels to w=1.0 (unguided), matching the gmass mass-only convention.
#
# D_bad = earliest own-ancestor inference ckpt (~50k), staged from Jupiter as the
# inference-format file ONLY (no base companion on purpose): model_loader then takes
# the inference-only branch (no training datamodule -> no dataset-path repoint needed;
# rank halo/partition caches invalidated for 4-GPU model-parallel).
#
# Owning note: ~/dev/docs/epics/tc-perf-high-resolution/guidance/in-progress/20260820_o2560_humberto_agmass_manual.md
base: o1280_o2560_humberto6h_pristine

predict:
  # Loader merge is 2 levels deep: this sampler block REPLACES the base one wholesale,
  # so the FULL base sampler (o1280_o2560.yaml) is restated verbatim, then autoguide_*.
  sampler:
    schedule_type: "experimental_piecewise"
    num_steps: 30
    sigma_max: 1000.0
    sigma_transition: 10.0
    sigma_min: 0.03
    high_schedule_type: "exponential"
    low_schedule_type: "karras"
    num_steps_high: 10
    num_steps_low: 20
    rho: 7.0
    sampler: "heun"
    S_churn: 2.5
    S_min: 0.75
    S_max: 1000.0
    S_noise: 1.05
    # --- autoguidance (the only deltas vs control) ---
    # Weak ckpt staged from Jupiter 2026-08-20, sha256-verified (integrity_manifest).
    # Fail-loud: predict refuses if the path does not resolve.
    autoguide_checkpoint: "/home/ecm5702/perm/checkpoints-jupiter-rebaseline-20260716/fccc23dfb5de4dfbbb2ca0c0e0ce3fdf/inference-anemoi-by_step-epoch_076-step_050000.ckpt"
    autoguide_weight_map: {msl: 1.3}
