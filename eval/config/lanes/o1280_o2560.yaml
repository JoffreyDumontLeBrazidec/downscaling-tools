prepml:
  debug_expvers: ["j5yb"]
  runner: anemoi-dev
  venv: /home/ecm5702/dev/anemoi-inference-configs/prepml_envs/ds-dyn-prepml-wrap
  input:
    class: od
    stream: enfo
    type: pf
    grid: O1280
    step_offset_hours: 6
  output:
    class: rd
    stream: enfo
    type: pf
  output_template: /home/ecm5702/hpcperm/data/o2560-template.grib
  forcings_npz: /home/ecm5702/hpcperm/data/o2560-forcings.npz
