# Same as o320_o1280_aifs_crps_v2_20250901 but WITH mass-only autoguidance at the CALIBRATED
# weight w=1.1 (the champion TC recipe). Restates predict.sampler in full (2-level merge) to add
# the autoguide_* keys; everything else identical, so guided-vs-unguided isolates the guidance.
base: o320_o1280_aifs_crps_v2_20250901

predict:
  sampler:
    schedule_type: "experimental_piecewise"
    num_steps: 30
    sigma_max: 100000.0
