# AIFS Humberto screen: sampler arm pw40 sigma_max 1e6 (40 steps, 13/27 split), UNGUIDED. Isolates the sampler axis vs the control.
base: o320_o1280_aifs_humberto
predict:
  sampler:
    schedule_type: "experimental_piecewise"
    num_steps: 40
    sigma_max: 1000000.0
    sigma_transition: 10.0
    sigma_min: 0.03
    high_schedule_type: "exponential"
    low_schedule_type: "karras"
    num_steps_high: 13
    num_steps_low: 27
    rho: 7.0
    sampler: "heun"
    S_churn: 2.5
    S_min: 0.75
    S_max: 1000000.0
    S_noise: 1.05
