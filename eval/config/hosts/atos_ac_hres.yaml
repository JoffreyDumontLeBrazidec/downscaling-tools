# Evaluation host for checkpoints of the fine-scale epic's experiment branch
# exp/hres-local-branch-20260902 (arms F, U, fdet and S of the 20260902_hres_local_branch campaign).
# Same machine and settings as atos_ac_pristine (global single-model forward; do NOT use
# atos_ac_unified for these, it degrades global runs), but the runtime is the experiment
# sandbox's own guarded venv: those checkpoints carry classes that exist only on that branch
# (anemoi.models.layers.hres_branch, AnemoiLocalDownscaler), so the pristine venv cannot load
# them. The sandbox activate.sh refuses unless every anemoi package resolves inside the sandbox
# (same contract as ~/hpcperm/lineages/_guard.py). The `absent` arm loads on pristine as well.
# Provenance: sandbox ~/hpcperm/sandbox/20260902-hres-local-branch, code @ 431656cc.
# A manifest lineage line for this sandbox is still owed (certified-runtime-provenance).
code_root: /home/ecm5702/dev/downscaling-tools
scratch_root: /home/ecm5702/scratch
perm_root: /home/ecm5702/perm
venv: /home/ecm5702/hpcperm/sandbox/20260902-hres-local-branch/.venv-x86_64

scheduler:
  qos: nf
  default_time: "04:00:00"
  default_mem: 64G
  default_cpus: 16

environment_setup:
  module_loads:
    - ecmwf-toolbox
  exports:
    DATA_DIR: /home/mlx/ai-ml/datasets/
    DATA_STABLE_DIR: /home/mlx/ai-ml/datasets/stable/
    OUTPUT: /ec/res4/scratch/ecm5702/aifs
    GRID_DIR: /home/mlx/ai-ml/grids/
    INTER_MAT_DIR: /home/ecm5702/hpcperm/data/inter_mat
    RESIDUAL_STATISTICS_DIR: /home/ecm5702/hpcperm/data/residuals_statistics/
    TORCHINDUCTOR_COMPILE_THREADS: "1"
    OMP_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
  venv_activate: /home/ecm5702/hpcperm/sandbox/20260902-hres-local-branch/activate.sh
