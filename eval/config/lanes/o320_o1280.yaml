# Same lane, staged onto the complete grid instead of templates with latitude
# rows dropped near the poles. That pole mask was measured on 2026-08-25 to
# shift the spectrum by 2.0% at the median and 13.2% at worst, inside the
# scored band. spectra_ecmwf above is kept unchanged as the reference.
spectra_ecmwf_v2:
  truncation: 1279  # O1280 nominal cubic-octahedral truncation: TCo1279
  template_root: "/home/ecm5702/hpcperm/reference_spectra/fullgrid_o1280"
  weather_states: ["10u", "10v", "2t", "msl", "t_850", "z_500"]
  # shared with spectra_ecmwf on purpose: v2 addresses its reference by window
  # and staging template, so the two cannot overwrite each other
  reference_dir: "/home/ecm5702/perm/reference/o320_o1280/spectra_ecmwf"
  steps: [120]
  members: [1]
  truth_label: "ENFO"
  input_label: "EEFO"
  input_bundles_dir: "/home/ecm5702/hpcperm/data/input_data/o320_o1280/idalia"

# texture (added 2026-09-02): fine-scale texture statistics measured on the NATIVE O1280
# grid with no regridding; the gate of the fine-scale-o320-o1280 epic. Run with --only texture.
texture:
  # z_500 excluded on purpose: its fine band is numerically delicate (regrid moire in the truth).
  weather_states: ["10u", "10v", "2t", "msl", "t_850"]
  # steps listed so that the CLI --steps flag propagates into this block (it only
  # overrides blocks that already carry a steps key); default = every step of the lane.
  steps: [24, 48, 72, 96, 120]
  # [lat_min, lat_max, lon_min, lon_max], longitudes in -180..180
  regions:
    europe: [35, 60, -10, 25]
    alps: [43, 49, 4, 16]
    open_north_atlantic: [35, 55, -45, -20]
    west_tropical_atlantic: [10, 25, -70, -45]

# membermaps (added 2026-09-02): the four-panel case-inspection maps, as an
# evaluator rather than a hand-written sbatch. Default OFF because it is a figure
# bundle, not a measurement: run it with `eval.cli evaluate --only membermaps`.
# Each combination renders input, truth and prediction, twice — the field itself
# and the fine-scale high-pass view.
membermaps:
  variables: ["wind10m", "msl", "2t"]
  fields: ["value", "fine"]
  # default = the middle step of the lane; listed so --steps propagates here
  steps: [72]
  members: [1]
  fine_cut_deg: 0.6
  # omitted on purpose: `regions` falls back to the texture block above, so the
  # two fine-scale diagnostics always speak about the same boxes.
