name: downscaling-od-an-oper-0001-mars-o1280-2026-2026-12h-6h-v1-aifscrps-validtime-forcings
description: FULL YEAR 2026 (1 Jan 00 UTC to 2026-09-09 12:00:00, starts at 00 and 12 UTC, leads 6 and 12 h). O1280 static lsm and surface z from the operational analysis plus the nine valid-time forcings (incl. insolation) on the same synthetic forecast axis (origin 1900-01-01) as the full-year AIFS-CRPS input store. Forcing store of the AIFS->analysis o320->o1280 lane (the in_hres dataset).
attribution: ECMWF
licence: CC-BY-4.0
dates:
  start: 2026-01-01 00:00:00
  end: 2026-09-09 12:00:00
  frequency: 12h
  fake_forecasts: true
  steps: [6, 12]
build:
  group_by: forecast

input:
  join:
  - mars:
      class: od
      stream: oper
      expver: "0001"
      type: an
      levtype: sfc
      grid: o1280
      param: [lsm, z]
  - forcings:
      template: ${input.join.0.mars}
      param: [cos_latitude, cos_longitude, sin_latitude, sin_longitude, cos_julian_day, cos_local_time, sin_julian_day, sin_local_time, insolation]
output:
  chunking: {dates: 1, ensembles: 1}
  dtype: float32
  ensemble_dimension: 2
  flatten_grid: true
  order_by: [{valid_datetime: ascending}, {param_level: ascending}, {number: ascending}]
  remapping: {param_level: "{param}_{levelist}"}
  statistics: param_level
