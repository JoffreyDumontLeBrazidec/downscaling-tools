# o96->o320 PRISTINE 200k + AUTOGUIDANCE w=1.5, OWN-ANCESTOR D_bad (step 50k of the same run).
# Canonical eval.cli route: same lane/dates/members/steps as ab250_global (the ctrl arm),
# so `eval.cli evaluate --only spectra,region_plot,surface,tc` is apples-to-apples.
# autoguide_* keys are popped by eval/predict/model_loader.py before predict_step routing.
base: o96_o320_pristine_adamw_aug2630_10m

predict:
  sampler:
    schedule_type: "experimental_piecewise"
    num_steps: 30
    sigma_max: 10000.0
    sigma_transition: 10.0
    sigma_min: 0.03
    high_schedule_type: "exponential"
    low_schedule_type: "karras"
    num_steps_high: 10
    num_steps_low: 20
    rho: 7.0
    sampler: "heun"
    S_churn: 2.5
    S_min: 0.75
    S_max: 10000.0
    S_noise: 1.05
    autoguide_checkpoint: "/home/ecm5702/perm/reference-runs/o96_o320__soap_pristine_7b599ee1/checkpoints/anemoi-by_step-epoch_024-step_050000.ckpt"
    autoguide_weight: 1.5
