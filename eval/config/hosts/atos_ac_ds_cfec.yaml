# Legacy DS-era eval host for cfec83a3/59e4 checkpoints (single-dataset downscaler).
# Same machine as atos_ac (AC, x86_64) but activates the *ds* runtime
# (.ds-dyn-dev, anemoi-core-ds @ branch ds) which carries ds_tensor.py +
# multi_dataset_normalizer needed to UNPICKLE DS-era inference checkpoints.
# The unified ds-260612 runtime CANNOT load these (ModuleNotFoundError:
# anemoi.models.preprocessing.multi_dataset_normalizer). Verified by CPU unpickle.
code_root: /home/ecm5702/dev/downscaling-tools
scratch_root: /home/ecm5702/scratch
perm_root: /home/ecm5702/perm
venv: /home/ecm5702/dev/.ds-dyn-dev

scheduler:
  qos: ng
  default_time: "04:00:00"
  default_mem: 64G
  default_cpus: 16

environment_setup:
  module_loads:
    - ecmwf-toolbox
  exports:
    DATA_DIR: /home/mlx/ai-ml/datasets/
    DATA_STABLE_DIR: /home/mlx/ai-ml/datasets/stable/
    OUTPUT: /ec/res4/scratch/ecm5702/aifs
    GRID_DIR: /home/mlx/ai-ml/grids/
    INTER_MAT_DIR: /home/ecm5702/hpcperm/data/inter_mat
    RESIDUAL_STATISTICS_DIR: /home/ecm5702/hpcperm/data/residuals_statistics/
    HYDRA_FULL_ERROR: "1"
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    TORCHINDUCTOR_COMPILE_THREADS: "1"
    OMP_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
  # Sources the runtime selection layer: activates .ds-dyn-dev, sets PYTHONPATH
  # prefix to anemoi-core-ds, and hard-asserts anemoi-core == ds@<sha>.
  venv_activate: /home/ecm5702/dev/runtimes/ds/activate.sh
