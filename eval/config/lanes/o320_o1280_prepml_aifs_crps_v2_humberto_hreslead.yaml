# Arm A (family e7cae421d05a43a68a410e5b8e4fa594) and the other checkpoints of the fine-scale
# local high-resolution branch (exp/hres-lead-branch-20260906 / exp/aifs-arm-a-20260908) run
# through the SAME prepml route as jaou, on the same five dates, members and steps. This lane
# is the Humberto lane with exactly two differences, both needed by that checkpoint family and
# both inert for the champion:
#   1. prepml.venv points at the hres-lead lineage wrap (~/hpcperm/lineages/hres-lead), the only
#      runtime that can unpickle the hres_branch classes. The manifest line for that lineage is
#      proposed in epics/downscaling-aifs-crps/in-progress/20260908_arm_a_finetune_u100k.md
#      (2026-09-14) and not yet registered.
#   2. predict.env adds CODEX_PREPML_DROP_GRIB_KEYS=model,timespan. A checkpoint trained on
#      AIFS ENS input (class=ai) carries `model` and `timespan` in every variable's MARS keys;
#      anemoi-inference copies them onto the output GRIB keys and eccodes refuses them on the
#      IFS O1280 template (job 36801395, 2026-09-14). The prepml sitecustomize patch of
#      2026-09-14 drops the listed keys; unset, nothing changes.
# The lane loader merges only two levels deep, so predict.env is restated in full, and so is the
# prepml.input opt-in (grid O320_aifs -> class=ai stream=enfo type=pf grid=O320) plus lead_time:
# without them a third-level lane silently falls back to the od/eefo input of the base (caught on
# expver jb9u, 2026-09-14, staged the wrong stream; that expver was cleaned and abandoned).
# Proof of the route (one date, one member, one lead, local GRIB, no FDB): AC job 36843943.
base: o320_o1280_prepml_aifs_crps_v2_humberto

predict:
  env:
    ANEMOI_INFERENCE_NUM_CHUNKS: 1
    ANEMOI_INFERENCE_NUM_CHUNKS_PROCESSOR: 1
    ANEMOI_INFERENCE_NUM_CHUNKS_MAPPER: 1
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    CODEX_UNIFIED_SHARD_STRATEGY: edges
    CODEX_PREPML_DROP_GRIB_KEYS: "model,timespan"

prepml:
  venv: /home/ecm5702/hpcperm/lineages/hres-lead/prepml-wrap
  input:
    grid: O320_aifs
  lead_time: 168h
