# Ladder profile — 712fce o96->o320 200k, the ONE run that carries both instruments:
#   * 12 rungs of inference-side scores (probabilistic, already computed 2026-07-07,
#     eval commit b8b52ce, lane oldnew_keystone_cell_D, 5 dates x 5 leads x 10 members)
#   * an MLflow file store under the run root (val_out_hres_mse_metric per variable)
# Used to test whether the free dense MLflow metric tracks the expensive inference RMSE.
# Task note: epics/training-diagnostics/metric-skill-gap/in-progress/20260727_ladder_mlflow_mse_spectra.md
card_id: conv712_o96_o320
lane: oldnew_keystone_cell_D
host: atos_ac_unified
bundle_dir: /home/ecm5702/hpcperm/data/input_data/o96_o320/idalia
venv: /home/ecm5702/dev/.ds-260612
cadence: 10000

# Recorded for provenance — predictions already exist, every rung runs --skip-predict.
budget:
  dates: '20230826,20230827,20230828,20230829,20230830'
  steps: '120'
  members: '10'

# Only the missing column is computed. probabilistic/ is symlinked in from the existing
# study dir, so the pinned probabilistic knobs below are documentation of what produced it.
evaluators: spectra_ecmwf_v2

# Ladder spectra pin (2026-09-28): spectra_ecmwf_v2 (ECMWF transform, complete grid, AC only)
# replaced the retired HEALPix proxy. The rung runs it in its own evaluate call without
# --steps, so these dates, steps and members hold; it costs one gptosp transform per
# (date, step, member, field). Its rows are named spectra_v2_<field>_* and are not
# comparable with the spectra_<field>_* rows of rungs scored before 2026-09-28.
spectra_ecmwf_v2:
  weather_states: [10u, 2t]
  dates: ["20230826", "20230827", "20230828", "20230829", "20230830"]
  steps: [120]
  members: [10]

slurm:
  qos: ng
  gpus: 1
  cpus: 8
  mem: 64G
  walltime: '01:00:00'
