# Classic suite case list, 4 km lane (o1280 -> o2560, E2 box), 2025 tropical-cyclone set
# (outputs/o2560_tc_20261109/pred/<row>/ on Jupiter: 31 base dates, +24/+48/+72 h, rows *_m = one draw per
# o1280 ENS member pf1-10, embedded iekm target). Fixed so that pages of two runs compare by eye.
name: o2560_tc_2025
description: "4 km E2 box, 2025 TC set (Erin, Gabrielle, Humberto, Imelda, Melissa), target iekm"
members: "1-10"
spectra:
  steps: [24, 72]          # exactly two pages (owner, 23 Nov 2026)
  box: null                # the file's own box (E2)
tc:                        # Humberto rapid intensification: IBTrACS 949 hPa, input members 976-1006 hPa
  name: humberto
  date: "20250926"
  step: 24
  extent: [-66.0, -50.0, 15.5, 29.5]
  variable: wind10m
rain:
  name: e2_rain
  date: auto               # wettest target member-mean tp max in the E2 box at +24 h
  step: 24
  extent: [-79.0, 39.0, 11.0, 69.0]
  variable: tp
areas:
  - {name: alps, date: auto, step: 24, extent: [4.0, 16.0, 43.0, 49.0], variable: tp}
  - {name: north_sea, date: auto, step: 24, extent: [-6.0, 14.0, 50.0, 62.0], variable: wind10m}
  - {name: iberia, date: auto, step: 24, extent: [-10.0, 4.0, 36.0, 44.0], variable: 2t}
stills:
  grid: O2560              # the files are an E2 crop of O2560
  cases:
    - {name: e2_wettest, date: auto, step: 24, variable: tp}
    - {name: humberto, date: "20250926", step: 24, variable: tp, extent: [-80.0, -40.0, 10.0, 40.0]}
tp_distribution:
  steps: [24, 48, 72]
scores:
  region: all
  variables: [[tp, raw], [10ff, raw], [2t, lapse], [msl, raw]]
