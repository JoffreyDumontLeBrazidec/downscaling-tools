# Canonical OPER analysis tail percentiles for TC scoring.
# Keyed by resolution tag, then event name.
# Adding new resolutions or events = YAML edit, not code change.
#
# CONTRACT NOTE (o96->o320, decided 2026-06-17; incident
# epics/ds-multi-ds-parity/in-progress/20260617_o96_o320_unified_oldlike_tc_regression.md;
# knowledge docs/knowledge/results/tc-extreme-score-support-contract.md):
# The "o320" idalia/franklin values below are a CURATED effective-analysis target,
# deliberately DEEPER than the embedded regridded OPER (idalia mslp_min 985.4 /
# wind_max 24.5; this file 971.3 / 32.0) and shallower than the native OPER (946.8).
# This is intentional: anchoring on the over-smoothed regridded OPER lets models
# trivially overshoot and the EEFO floor collapses the score (~0.05); anchoring on
# the deep native OPER floors franklin to 0.0. The curated mid-target is the only
# well-conditioned, discriminating anchor. DO NOT "re-derive" these to a same-support
# OPER percentile -- that re-breaks the metric. Keep pinned; the model is scored on
# the REGRIDDED support against this target.

o320:
  idalia:
    mslp_p1: 1002.7293048095703
    mslp_p01: 992.9954538574219
    mslp_min: 971.3018798828125
    wind_p99: 14.000569772720336
    wind_p999: 22.4329648017885
    wind_max: 32.032962799072266
  franklin:
    mslp_p1: 1000.1705812499999
    mslp_p01: 985.811875
    mslp_min: 957.39375
    wind_p99: 18.191709977264132
    wind_p999: 25.2288104076867
    wind_max: 36.36738498393529

o1280:
