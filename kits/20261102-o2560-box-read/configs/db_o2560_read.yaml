data:
  format: zarr
  frequency: 1h
  timestep: ${data.frequency}
  datasets:
    in_lres:
      forcing: null
      diagnostic: []
      processors:
        normalizer:
          _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
          config:
            default: mean-std
            std: null
            min-max: null
            max: null
            none: null
    in_hres:
      forcing:
      - cos_latitude
      - cos_longitude
      - sin_latitude
      - sin_longitude
      - cos_julian_day
      - cos_local_time
      - sin_julian_day
      - sin_local_time
      diagnostic: []
      processors:
        normalizer:
          _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
          config:
            default: mean-std
            std: null
            min-max: null
            max:
            - z
            none:
            - cos_latitude
            - cos_longitude
            - sin_latitude
            - sin_longitude
            - cos_julian_day
            - cos_local_time
            - sin_julian_day
            - sin_local_time
            - insolation
            - lsm
    out_hres:
      forcing: null
      diagnostic: []
      direct_prediction:
      - tp
      - cp
      processors:
        normalizer:
          _target_: anemoi.models.preprocessing.normalizer.InputNormalizer
          config:
            default: mean-std
            std:
            - tp
            - cp
            min-max: null
            max: null
            none: null
  num_features: null
dataloader:
  emit_lead_hours: false
  prefetch_factor: 1
  pin_memory: true
  read_group_size: ${system.hardware.num_gpus_per_model}
  num_workers:
