# Regional cut-graph counterpart of o320_o1280_piecewise21_s1k.
# Same global checkpoint, cases, members, and sampler; spatial scope is the
# only intended experimental change.
base: tc_o320_o1280

allowed_hosts:
  prepare: [atos_ag]
  predict: [atos_ag]
  run: [atos_ag]
  evaluate: [atos_ag, atos_ac]
  scoreboard: [atos_ac]

predict:
  sampler:
    schedule_type: "experimental_piecewise"
    num_steps: 21
    sigma_max: 1000.0
    sigma_transition: 10.0
    sigma_min: 0.03
    high_schedule_type: "exponential"
    low_schedule_type: "karras"
    num_steps_high: 7
    num_steps_low: 14
    rho: 7.0
    sampler: "heun"
    S_churn: 2.5
    S_min: 0.75
    S_max: 1000.0
    S_noise: 1.05

evaluator_groups:
  default: [tc, local_global]
  diagnostics: []

local_global:
  global_predictions_dir: "/home/ecm5702/scratch/eval/o320_o1280_piecewise_sigma_sweep_20260728T080101Z/eval_inputs/o320_o1280_piecewise21_s1k"
  coordinate_tolerance: 1.0e-6
  variables: ["y_pred", "y", "x_interp"]
